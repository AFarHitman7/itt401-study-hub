<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>ITT401 Data Analytics: Exam Study Hub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header id="topbar">
  <button type="button" id="menuBtn" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
  <div id="brand"><b>ITT401</b> · Data Analytics <span class="sub">KTU 2019 Scheme</span></div>
  <nav id="tabs" aria-label="Views">
    <button type="button" data-view="notes" class="active" aria-current="page">Notes</button>
    <button type="button" data-view="practice">Practice Q&amp;A</button>
    <button type="button" data-view="pyq">PYQ</button>
    <button type="button" data-view="plan">Study Plan</button>
  </nav>
  <div id="searchWrap">
    <input type="search" id="search" placeholder="Search notes…" aria-label="Search notes" aria-controls="sidebar" autocomplete="off">
  </div>
</header>

<div id="scrim" hidden></div>

<div id="layout">
  <aside id="sidebar"></aside>
  <main id="content" tabindex="-1"></main>
  <footer id="foot">
    Built from the official KTU 2019-scheme ITT401 syllabus, past exam papers, and the sources cited on each topic.
    Runs fully offline. Open <code>index.html</code> anytime.
  </footer>
</div>

<script src="data/pyq.js"></script>
<script src="data/diagrams.js"></script>
<script src="data/module1.js"></script>
<script src="data/module2.js"></script>
<script src="data/module3.js"></script>
<script src="data/module4.js"></script>
<script src="data/module5.js"></script>
<script src="data/tactics.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
